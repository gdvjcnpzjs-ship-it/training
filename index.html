<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- iPhone ホーム画面追加用設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRAIN LOG">

  <!-- JSで動的にPNGのapple-touch-iconを注入するため要素のみ定義 -->
  <link rel="apple-touch-icon" id="dynamic-apple-touch-icon" href="">
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><rect width='180' height='180' fill='%23030503'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-size='100' fill='%23ffffff'></text></svg>">

  <title>TRAINING MATRIX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Courier New', Consolas, Monaco, monospace;
    }

    body {
      background-color: #030503;
      color: #00ff66;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 15px) 10px;
    }

    header {
      text-align: center;
      padding: 4px 0;
      border-bottom: 1px solid #003311;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 3px;
      color: #00ff66;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
    }

    /* メインタブ切替ナビゲーション */
    .tab-container {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      background: #001a00;
      border: 1px solid #004411;
      color: #00aa44;
      padding: 6px 0;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .tab-btn.active {
      background: #00ff66;
      color: #000;
      border-color: #00ff66;
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
    }

    /* ビュー切替 */
    .view-content {
      display: none;
    }
    .view-content.active {
      display: block;
    }

    /* カレンダーナビゲーション */
    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .nav-btn {
      background: #001a00;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 3px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .nav-btn:active {
      background: #00ff66;
      color: #000;
    }

    .month-title {
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* カレンダー本体 */
    .calendar-container {
      border: 1px solid #004411;
      background-color: #000d00;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
    }

    .weekday-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.65rem;
      padding: 5px 0;
      border-bottom: 1px solid #003311;
      background-color: #001500;
    }

    .weekday { color: #00aa44; }
    .weekday.sun { color: #ff5555; }
    .weekday.sat { color: #00aaff; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .day-cell {
      min-height: 58px;
      border-right: 1px solid #002200;
      border-bottom: 1px solid #002200;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 2px;
      position: relative;
      background-color: #030503;
    }
    .day-cell:nth-child(7n) {
      border-right: none;
    }

    .day-cell.other-month {
      opacity: 0.2;
      background-color: #010301;
    }

    .day-cell.today {
      background-color: #001a08;
      box-shadow: inset 0 0 0 1px #00ff66;
    }

    .day-number {
      font-size: 0.65rem;
      text-align: center;
      margin-bottom: 2px;
      color: #00aa44;
    }
    .day-cell.today .day-number {
      font-weight: bold;
      color: #00ff66;
      text-shadow: 0 0 4px #00ff66;
    }

    /* 記録バー */
    .bars-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
    }

    .bar-wrapper {
      height: 5px;
      width: 100%;
      display: flex;
    }

    .bar {
      height: 100%;
      width: 100%;
    }

    .bar.vit {
      background-color: #00a2ff;
      box-shadow: 0 0 4px rgba(0, 162, 255, 0.8);
    }
    .bar.str {
      background-color: #ff3355;
      box-shadow: 0 0 4px rgba(255, 51, 85, 0.8);
    }
    .bar.int {
      background-color: #00ff66;
      box-shadow: 0 0 4px rgba(0, 255, 102, 0.8);
    }
    .bar.cha {
      background-color: #ffcc00;
      box-shadow: 0 0 4px rgba(255, 204, 0, 0.8);
    }

    /* 連続入力時の連結スタイル */
    .bar.standalone {
      border-radius: 2px;
      margin: 0 1px;
      width: calc(100% - 2px);
    }
    .bar.connect-left-only {
      border-top-right-radius: 2px;
      border-bottom-right-radius: 2px;
      margin-right: 1px;
      width: calc(100% - 1px);
    }
    .bar.connect-right-only {
      border-top-left-radius: 2px;
      border-bottom-left-radius: 2px;
      margin-left: 1px;
      width: calc(100% - 1px);
    }
    .bar.connect-both {
      border-radius: 0;
      margin: 0;
      width: 100%;
    }

    /* 当日入力コントローラー */
    .controls {
      margin-top: 10px;
      background-color: #001100;
      border: 1px solid #004411;
      border-radius: 8px;
      padding: 10px;
    }

    .controls-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px dashed #003311;
    }

    .controls-title {
      font-size: 0.7rem;
      color: #00cc55;
      letter-spacing: 1px;
    }

    .today-status {
      font-size: 0.7rem;
    }

    .button-group-container {
      display: flex;
      gap: 6px;
    }

    .btn-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .main-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 5px;
      background: #030503;
      cursor: pointer;
      transition: background 0.1s;
    }

    .main-btn.vit-btn { color: #00a2ff; border: 1.5px solid #00a2ff; box-shadow: inset 0 0 4px rgba(0, 162, 255, 0.2); }
    .main-btn.vit-btn:active { background: #00a2ff; color: #000; }

    .main-btn.str-btn { color: #ff3355; border: 1.5px solid #ff3355; box-shadow: inset 0 0 4px rgba(255, 51, 85, 0.2); }
    .main-btn.str-btn:active { background: #ff3355; color: #000; }

    .main-btn.int-btn { color: #00ff66; border: 1.5px solid #00ff66; box-shadow: inset 0 0 4px rgba(0, 255, 102, 0.2); }
    .main-btn.int-btn:active { background: #00ff66; color: #000; }

    .main-btn.cha-btn { color: #ffcc00; border: 1.5px solid #ffcc00; box-shadow: inset 0 0 4px rgba(255, 204, 0, 0.2); }
    .main-btn.cha-btn:active { background: #ffcc00; color: #000; }

    .cancel-btn {
      background: transparent;
      border: 1px solid #113311;
      color: #447744;
      font-size: 0.6rem;
      padding: 4px 0;
      text-align: center;
      border-radius: 3px;
      cursor: pointer;
    }
    .cancel-btn:active {
      background: #220000;
      color: #ff8888;
      border-color: #ff3355;
    }

    /* RPGステータス画面デザイン */
    .status-window {
      border: 2px solid #00ff66;
      background-color: #000d00;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.15);
      position: relative;
    }
    .status-window::before {
      content: "STATUS";
      position: absolute;
      top: -10px;
      left: 14px;
      background: #030503;
      padding: 0 6px;
      font-size: 0.75rem;
      color: #00ff66;
      letter-spacing: 2px;
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px dashed #004411;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .player-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
    }

    .player-level {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffcc00;
      text-shadow: 0 0 6px rgba(255, 204, 0, 0.5);
    }

    .next-level-info {
      font-size: 0.7rem;
      color: #00aa44;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    /* 強調表示したSP消費エリア */
    .sp-section {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      margin-top: 8px;
    }

    .skill-points-info {
      font-size: 0.9rem;
      color: #00ff66;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* 大型化したUSE SPボタン */
    .use-sp-btn {
      background: #00ff66;
      border: 2px solid #00ff66;
      color: #000000;
      font-size: 0.85rem;
      font-weight: 900;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1.5px;
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.6);
      transition: all 0.15s ease;
    }

    .use-sp-btn.active-pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(0, 255, 102, 0);
        transform: scale(1.03);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(0, 255, 102, 0);
        transform: scale(1);
      }
    }

    .use-sp-btn:disabled {
      opacity: 0.25;
      background: #002200;
      border-color: #004411;
      color: #00aa44;
      cursor: not-allowed;
      box-shadow: none;
      animation: none;
    }

    .use-sp-btn:not(:disabled):active {
      transform: scale(0.95);
      background: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 20px #ffffff;
    }

    .stat-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .stat-label.vit { color: #00a2ff; }
    .stat-label.str { color: #ff3355; }
    .stat-label.int { color: #00ff66; }
    .stat-label.cha { color: #ffcc00; }

    .stat-value {
      color: #ffffff;
    }

    .gauge-bg {
      width: 100%;
      height: 10px;
      background-color: #001500;
      border: 1px solid #003311;
      border-radius: 3px;
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .gauge-fill.vit { background-color: #00a2ff; box-shadow: 0 0 6px #00a2ff; }
    .gauge-fill.str { background-color: #ff3355; box-shadow: 0 0 6px #ff3355; }
    .gauge-fill.int { background-color: #00ff66; box-shadow: 0 0 6px #00ff66; }
    .gauge-fill.cha { background-color: #ffcc00; box-shadow: 0 0 6px #ffcc00; }
  </style>
</head>
<body>

  <div>
    <header>
      <h1>TRAINING MATRIX</h1>
    </header>

    <!-- タブ切り替えボタン -->
    <div class="tab-container">
      <div class="tab-btn active" id="tab-calendar">[ CALENDAR ]</div>
      <div class="tab-btn" id="tab-status">[ STATUS ]</div>
    </div>

    <!-- カレンダー画面 -->
    <div class="view-content active" id="view-calendar">
      <div class="nav-container">
        <button class="nav-btn" id="prev-month">&lt;</button>
        <div class="month-title" id="month-title">----.--</div>
        <button class="nav-btn" id="next-month">&gt;</button>
      </div>

      <div class="calendar-container">
        <div class="weekday-header">
          <div class="weekday sun">SUN</div>
          <div class="weekday">MON</div>
          <div class="weekday">TUE</div>
          <div class="weekday">WED</div>
          <div class="weekday">THU</div>
          <div class="weekday">FRI</div>
          <div class="weekday sat">SAT</div>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>
    </div>

    <!-- ステータス画面 -->
    <div class="view-content" id="view-status">
      <div class="status-window">
        <div class="status-header">
          <div>
            <div class="player-name">HERO</div>
            <div class="player-level" id="stat-level">LV.1</div>
            <div class="next-level-info" id="stat-next">NEXT: 4 pts</div>
          </div>
          <div class="sp-section">
            <span class="skill-points-info" id="stat-sp">SP: 0</span>
            <button class="use-sp-btn" id="use-sp-btn">USE SP</button>
          </div>
        </div>
        <div class="stat-list">
          <!-- VIT -->
          <div class="stat-item">
            <div class="stat-info">
              <span class="stat-label vit">VIT (Vitality)</span>
              <span class="stat-value" id="val-vit">0 pts</span>
            </div>
            <div class="gauge-bg">
              <div class="gauge-fill vit" id="gauge-vit"></div>
            </div>
          </div>
          <!-- STR -->
          <div class="stat-item">
            <div class="stat-info">
              <span class="stat-label str">STR (Strength)</span>
              <span class="stat-value" id="val-str">0 pts</span>
            </div>
            <div class="gauge-bg">
              <div class="gauge-fill str" id="gauge-str"></div>
            </div>
          </div>
          <!-- INT -->
          <div class="stat-item">
            <div class="stat-info">
              <span class="stat-label int">INT (Intelligence)</span>
              <span class="stat-value" id="val-int">0 pts</span>
            </div>
            <div class="gauge-bg">
              <div class="gauge-fill int" id="gauge-int"></div>
            </div>
          </div>
          <!-- CHA -->
          <div class="stat-item">
            <div class="stat-info">
              <span class="stat-label cha">CHA (Charisma)</span>
              <span class="stat-value" id="val-cha">0 pts</span>
            </div>
            <div class="gauge-bg">
              <div class="gauge-fill cha" id="gauge-cha"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 当日用入力パネル（カレンダー画面時） -->
  <div class="controls" id="controls-panel">
    <div class="controls-header">
      <span class="controls-title">&gt; TODAY INPUT</span>
      <span class="today-status" id="today-date-str">----/--/--</span>
    </div>

    <div class="button-group-container">
      <!-- VITグループ -->
      <div class="btn-wrapper">
        <div class="main-btn vit-btn" id="btn-vit">VIT</div>
        <button class="cancel-btn" id="btn-vit-cancel">取消</button>
      </div>

      <!-- STRグループ -->
      <div class="btn-wrapper">
        <div class="main-btn str-btn" id="btn-str">STR</div>
        <button class="cancel-btn" id="btn-str-cancel">取消</button>
      </div>

      <!-- INTグループ -->
      <div class="btn-wrapper">
        <div class="main-btn int-btn" id="btn-int">INT</div>
        <button class="cancel-btn" id="btn-int-cancel">取消</button>
      </div>

      <!-- CHAグループ -->
      <div class="btn-wrapper">
        <div class="main-btn cha-btn" id="btn-cha">CHA</div>
        <button class="cancel-btn" id="btn-cha-cancel">取消</button>
      </div>
    </div>
  </div>

  <script>
    // iOS Safari用: Canvasで「黒背景 ＋ 白文字」のPNG Data URLを動的生成してapple-touch-iconにセット
    (function generateAppleTouchIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');

      // 背景（黒）
      ctx.fillStyle = '#030503';
      ctx.fillRect(0, 0, 180, 180);

      // 絵文字（白文字）
      ctx.font = '100px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('', 90, 98);

      // PNGデータURLへ変換してlink要素に設定
      const pngDataUrl = canvas.toDataURL('image/png');
      const iconTag = document.getElementById('dynamic-apple-touch-icon');
      if (iconTag) {
        iconTag.href = pngDataUrl;
      }
    })();

    const STORAGE_KEY = 'matrix_training_logs_v1';
    const SP_USED_KEY = 'matrix_training_sp_used_v1';
    
    let displayDate = new Date();
    const today = new Date();
    const todayStr = formatDateStr(today);

    function getLogs() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (!data) return {};
      const logs = JSON.parse(data);
      
      Object.keys(logs).forEach(date => {
        if (logs[date].run !== undefined && logs[date].vit === undefined) {
          logs[date].vit = logs[date].run;
        }
      });
      return logs;
    }

    function saveLogs(logs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    }

    function getUsedSp() {
      const data = localStorage.getItem(SP_USED_KEY);
      return data ? parseInt(data, 10) : 0;
    }

    function saveUsedSp(count) {
      localStorage.setItem(SP_USED_KEY, count.toString());
    }

    function formatDateStr(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getShiftedDateStr(dateStr, days) {
      const parts = dateStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + days);
      return formatDateStr(d);
    }

    // カレンダー描画
    function renderCalendar() {
      const year = displayDate.getFullYear();
      const month = displayDate.getMonth();

      document.getElementById('month-title').textContent = `${year}.${String(month + 1).padStart(2, '0')}`;
      document.getElementById('today-date-str').textContent = todayStr.replace(/-/g, '.');

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      const startDayOfWeek = firstDay.getDay();
      const totalDays = lastDay.getDate();

      const logs = getLogs();

      // 前月埋め
      const prevMonthLastDay = new Date(year, month, 0).getDate();
      for (let i = startDayOfWeek - 1; i >= 0; i--) {
        const d = prevMonthLastDay - i;
        const pDate = new Date(year, month - 1, d);
        const dateStr = formatDateStr(pDate);
        grid.appendChild(createCell(d, true, dateStr, logs, (startDayOfWeek - 1 - i)));
      }

      // 当月
      for (let d = 1; d <= totalDays; d++) {
        const currentDate = new Date(year, month, d);
        const dateStr = formatDateStr(currentDate);
        const dayOfWeek = currentDate.getDay();
        const isToday = (dateStr === todayStr);
        grid.appendChild(createCell(d, false, dateStr, logs, dayOfWeek, isToday));
      }

      // 翌月埋め（6行表示に統一）
      const totalCells = grid.children.length;
      const nextDays = (totalCells > 35 ? 42 : 35) - totalCells;
      for (let d = 1; d <= nextDays; d++) {
        const nDate = new Date(year, month + 1, d);
        const dateStr = formatDateStr(nDate);
        const dayOfWeek = nDate.getDay();
        grid.appendChild(createCell(d, true, dateStr, logs, dayOfWeek));
      }

      updateButtonStatus();
    }

    function createCell(dayNumber, isOtherMonth, dateStr, logs, dayOfWeek, isToday = false) {
      const cell = document.createElement('div');
      cell.className = `day-cell ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}`;

      const numEl = document.createElement('div');
      numEl.className = 'day-number';
      numEl.textContent = dayNumber;
      cell.appendChild(numEl);

      const barsContainer = document.createElement('div');
      barsContainer.className = 'bars-container';

      barsContainer.appendChild(createBarSlot('vit', dateStr, logs, dayOfWeek));
      barsContainer.appendChild(createBarSlot('str', dateStr, logs, dayOfWeek));
      barsContainer.appendChild(createBarSlot('int', dateStr, logs, dayOfWeek));
      barsContainer.appendChild(createBarSlot('cha', dateStr, logs, dayOfWeek));

      cell.appendChild(barsContainer);
      return cell;
    }

    function createBarSlot(type, dateStr, logs, dayOfWeek) {
      const wrapper = document.createElement('div');
      wrapper.className = 'bar-wrapper';

      const log = logs[dateStr];
      if (log && log[type]) {
        const bar = document.createElement('div');
        
        const prevDateStr = getShiftedDateStr(dateStr, -1);
        const nextDateStr = getShiftedDateStr(dateStr, 1);

        const hasLeft = (dayOfWeek > 0) && logs[prevDateStr] && logs[prevDateStr][type];
        const hasRight = (dayOfWeek < 6) && logs[nextDateStr] && logs[nextDateStr][type];

        let connectClass = 'standalone';
        if (hasLeft && hasRight) {
          connectClass = 'connect-both';
        } else if (hasLeft) {
          connectClass = 'connect-left-only';
        } else if (hasRight) {
          connectClass = 'connect-right-only';
        }

        bar.className = `bar ${type} ${connectClass}`;
        wrapper.appendChild(bar);
      }
      return wrapper;
    }

    function setLog(type, value) {
      const logs = getLogs();
      if (!logs[todayStr]) {
        logs[todayStr] = {};
      }
      logs[todayStr][type] = value;

      if (!logs[todayStr].vit && !logs[todayStr].str && !logs[todayStr].int && !logs[todayStr].cha) {
        delete logs[todayStr];
      }

      saveLogs(logs);
      renderCalendar();
      renderStatus();
    }

    function updateButtonStatus() {
      const logs = getLogs();
      const current = logs[todayStr] || {};
      
      const types = [
        { id: 'btn-vit', key: 'vit', activeBg: '#00a2ff', color: '#00a2ff' },
        { id: 'btn-str', key: 'str', activeBg: '#ff3355', color: '#ff3355' },
        { id: 'btn-int', key: 'int', activeBg: '#00ff66', color: '#00ff66' },
        { id: 'btn-cha', key: 'cha', activeBg: '#ffcc00', color: '#ffcc00' }
      ];

      types.forEach(t => {
        const btn = document.getElementById(t.id);
        const isActive = !!current[t.key];
        btn.style.background = isActive ? t.activeBg : '#030503';
        btn.style.color = isActive ? '#000' : t.color;
      });
    }

    function consumeSkillPoint() {
      const logs = getLogs();
      let vitCount = 0, strCount = 0, intCount = 0, chaCount = 0;

      Object.values(logs).forEach(log => {
        if (log.vit) vitCount++;
        if (log.str) strCount++;
        if (log.int) intCount++;
        if (log.cha) chaCount++;
      });

      const totalPt = vitCount + strCount + intCount + chaCount;

      let level = 1;
      let reqNext = 4;
      let tempPt = totalPt;

      while (tempPt >= reqNext) {
        tempPt -= reqNext;
        level++;
        reqNext += 4;
      }

      const totalGainedSp = (level - 1) * 3;
      const usedSp = getUsedSp();
      const remainingSp = totalGainedSp - usedSp;

      if (remainingSp > 0) {
        saveUsedSp(usedSp + 1);
        renderStatus();
      }
    }

    // RPGステータス描画
    function renderStatus() {
      const logs = getLogs();
      let vitCount = 0, strCount = 0, intCount = 0, chaCount = 0;

      Object.values(logs).forEach(log => {
        if (log.vit) vitCount++;
        if (log.str) strCount++;
        if (log.int) intCount++;
        if (log.cha) chaCount++;
      });

      const totalPt = vitCount + strCount + intCount + chaCount;

      // レベル計算
      let level = 1;
      let reqNext = 4;
      let tempPt = totalPt;

      while (tempPt >= reqNext) {
        tempPt -= reqNext;
        level++;
        reqNext += 4;
      }

      const ptsToNext = reqNext - tempPt;

      const totalGainedSp = (level - 1) * 3;
      const usedSp = getUsedSp();
      const remainingSp = totalGainedSp - usedSp;

      document.getElementById('stat-level').textContent = `LV.${level}`;
      document.getElementById('stat-next').textContent = `NEXT: ${ptsToNext} pts`;
      document.getElementById('stat-sp').textContent = `SP: ${remainingSp}`;

      const useBtn = document.getElementById('use-sp-btn');
      if (useBtn) {
        const canUse = remainingSp > 0;
        useBtn.disabled = !canUse;
        if (canUse) {
          useBtn.classList.add('active-pulse');
        } else {
          useBtn.classList.remove('active-pulse');
        }
      }

      document.getElementById('val-vit').textContent = `${vitCount} pts`;
      document.getElementById('val-str').textContent = `${strCount} pts`;
      document.getElementById('val-int').textContent = `${intCount} pts`;
      document.getElementById('val-cha').textContent = `${chaCount} pts`;

      const maxVal = Math.max(vitCount, strCount, intCount, chaCount, 10);
      document.getElementById('gauge-vit').style.width = `${(vitCount / maxVal) * 100}%`;
      document.getElementById('gauge-str').style.width = `${(strCount / maxVal) * 100}%`;
      document.getElementById('gauge-int').style.width = `${(intCount / maxVal) * 100}%`;
      document.getElementById('gauge-cha').style.width = `${(chaCount / maxVal) * 100}%`;
    }

    // イベントリスナー設定
    document.getElementById('tab-calendar').addEventListener('click', () => {
      document.getElementById('tab-calendar').classList.add('active');
      document.getElementById('tab-status').classList.remove('active');
      document.getElementById('view-calendar').classList.add('active');
      document.getElementById('view-status').classList.remove('active');
    });

    document.getElementById('tab-status').addEventListener('click', () => {
      document.getElementById('tab-status').classList.add('active');
      document.getElementById('tab-calendar').classList.remove('active');
      document.getElementById('view-status').classList.add('active');
      document.getElementById('view-calendar').classList.remove('active');
      renderStatus();
    });

    document.getElementById('prev-month').addEventListener('click', () => {
      displayDate.setMonth(displayDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('next-month').addEventListener('click', () => {
      displayDate.setMonth(displayDate.getMonth() + 1);
      renderCalendar();
    });

    // 入力ボタン
    document.getElementById('btn-vit').addEventListener('click', () => setLog('vit', true));
    document.getElementById('btn-vit-cancel').addEventListener('click', () => setLog('vit', false));

    document.getElementById('btn-str').addEventListener('click', () => setLog('str', true));
    document.getElementById('btn-str-cancel').addEventListener('click', () => setLog('str', false));

    document.getElementById('btn-int').addEventListener('click', () => setLog('int', true));
    document.getElementById('btn-int-cancel').addEventListener('click', () => setLog('int', false));

    document.getElementById('btn-cha').addEventListener('click', () => setLog('cha', true));
    document.getElementById('btn-cha-cancel').addEventListener('click', () => setLog('cha', false));

    // スキルポイント使用ボタン
    document.getElementById('use-sp-btn').addEventListener('click', consumeSkillPoint);

    // 初期描画
    renderCalendar();
    renderStatus();
  </script>
</body>
</html>
